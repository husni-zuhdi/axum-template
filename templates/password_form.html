<form hx-post="/settings/password"
      hx-target="this"
      hx-swap="outerHTML"
      class="max-w-md">
    {% if !error.is_empty() %}
        <div class="mb-4 p-3 rounded-lg text-sm font-medium bg-red-100 text-red-800 border border-red-200">{{ error }}</div>
    {% endif %}
    <div class="grid gap-4">
        <div>
            <label for="current_password" class="block text-xs text-gray-500 mb-1">Current password</label>
            <input type="password"
                   id="current_password"
                   name="current_password"
                   required
                   autocomplete="current-password"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
        </div>
        <div>
            <label for="new_password" class="block text-xs text-gray-500 mb-1">New password</label>
            <input type="password"
                   id="new_password"
                   name="new_password"
                   required
                   autocomplete="new-password"
                   minlength="8"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
        </div>
        <div>
            <label for="confirm_password" class="block text-xs text-gray-500 mb-1">Confirm new password</label>
            <input type="password"
                   id="confirm_password"
                   name="confirm_password"
                   required
                   autocomplete="new-password"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
        </div>
    </div>
    <p class="text-xs text-gray-500 mt-3 mb-4">
        At least 8 characters, with one uppercase letter, one number, and one special character.
    </p>
    <button type="submit"
            class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm hover:bg-blue-700">
        Change password
    </button>
</form>
