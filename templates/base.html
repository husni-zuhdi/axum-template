<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ title }} - Axum Template</title>
        <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
        <meta name="csrf-token" content="{{ csrf_token }}">
        <link rel="stylesheet" href="/static/styles.css">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
              crossorigin="anonymous"
              referrerpolicy="no-referrer">
        <script src="https://unpkg.com/htmx.org@2.0.4"
                integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
                crossorigin="anonymous"></script>
        <script>
        function getCsrfToken() {
            var meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? meta.getAttribute('content') : '';
        }

        document.addEventListener('htmx:configRequest', function(evt) {
            var token = getCsrfToken();
            if (token) {
                evt.detail.headers['x-csrf-token'] = token;
            }
        });

        document.addEventListener('htmx:beforeSwap', function(evt) {
            if (evt.detail.xhr.status >= 400) {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false;
            }
        });

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }
        </script>
    </head>
    <body class="bg-gray-50 min-h-screen">
        <nav class="bg-white shadow-sm">
            <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                <a href="/"
                   class="text-xl font-semibold text-gray-800 flex items-center gap-3">
                    <i class="fa-solid fa-code text-blue-600"></i>
                    <span>Axum Template</span>
                </a>
                <div class="hidden sm:flex gap-1 items-center">
                    <a href="/"
                       class="text-gray-600 hover:text-gray-800 py-2 px-3 rounded hover:bg-gray-100">
                        <i class="fa-solid fa-house mr-1.5"></i>Home</a>
                    <a href="/settings"
                       class="text-gray-600 hover:text-gray-800 py-2 px-3 rounded hover:bg-gray-100">
                        <i class="fa-solid fa-gear mr-1.5"></i>Settings</a>
                    <a href="/logout"
                       class="text-gray-600 hover:text-gray-800 py-2 px-3 rounded hover:bg-gray-100">
                        <i class="fa-solid fa-right-from-bracket mr-1.5"></i>Logout</a>
                </div>
                <button class="sm:hidden text-gray-600 p-2 hover:bg-gray-100 rounded"
                        onclick="toggleMobileMenu()"
                        aria-label="Menu">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
            <div id="mobile-menu"
                 class="hidden sm:hidden border-t border-gray-100 px-4 py-2">
                <a href="/"
                   class="block text-gray-600 hover:text-gray-800 py-2 px-3 rounded hover:bg-gray-100">
                    <i class="fa-solid fa-house mr-1.5"></i>Home</a>
                <a href="/settings"
                   class="block text-gray-600 hover:text-gray-800 py-2 px-3 rounded hover:bg-gray-100">
                    <i class="fa-solid fa-gear mr-1.5"></i>Settings</a>
                <a href="/logout"
                   class="block text-gray-600 hover:text-gray-800 py-2 px-3 rounded hover:bg-gray-100">
                    <i class="fa-solid fa-right-from-bracket mr-1.5"></i>Logout</a>
            </div>
        </nav>
        <main class="max-w-5xl mx-auto px-4 py-8">
            {% if !flash_message.is_empty() %}
                <div id="flash-message"
                     class="mb-4 p-4 rounded-lg text-sm font-medium {% if flash_kind == "error" %}bg-red-100 text-red-800 border border-red-200 {% elif flash_kind == "success" %}bg-green-100 text-green-800 border border-green-200 {% else %}bg-blue-100 text-blue-800 border border-blue-200{% endif %}"
                     hx-on::load="setTimeout(function(){ document.getElementById('flash-message').remove(); }, 5000)">
                    {{ flash_message }}
                    <button onclick="this.parentElement.remove()" class="float-right font-bold">&times;</button>
                </div>
            {% endif %}
            {% block content %}{% endblock %}
        </main>
        {% block extra_scripts %}{% endblock %}
    </body>
</html>
